<!-- =====================================================================
     마우스 보정 실험 — 화면 마크업

     app.py 가 gr.HTML() 로 이 조각을 그대로 삽입한다.
     화면은 셋뿐이다: 설정 → 진행 → 완료.
===================================================================== -->
<div id="mx-app">

  <!-- ===================== 설정 ===================== -->
  <section id="mx-screen-setup" class="mx-screen active">
    <div class="mx-panel">
      <h1>마우스 보정 실험</h1>
      <p class="mx-hint" id="mx-build-line"></p>

      <div class="mx-field">
        <label for="mx-student-id">학번</label>
        <input type="text" id="mx-student-id" placeholder="예: 20231234" autocomplete="off">
      </div>

      <div class="mx-field">
        <label for="mx-name">이름</label>
        <input type="text" id="mx-name" placeholder="예: 홍길동" autocomplete="off">
      </div>

      <div class="mx-field">
        <label for="mx-participant-id">참가자 ID</label>
        <input type="text" id="mx-participant-id" placeholder="예: P01" autocomplete="off">
        <div class="mx-hint">영문·숫자·<code>_</code>·<code>-</code> 만. 파일명에 들어갑니다.</div>
      </div>

      <div class="mx-field">
        <label for="mx-button-size">버튼 크기 (px)</label>
        <input type="number" id="mx-button-size" min="4" max="80" step="1" value="12">
        <div class="mx-hint">참가자 전원 같은 값을 쓸 것.</div>
      </div>

      <div class="mx-field">
        <button id="mx-start" class="mx-primary mx-big" disabled>전체화면으로 시작</button>
        <div class="mx-bad" id="mx-start-blocked"></div>
        <div class="mx-hint">
          시작 전에: 마우스 가속(포인터 정밀도 향상) 끄기 · 확대율 100%(Ctrl+0) · 트랙패드 아님 ·
          한 세션에 끝내기(약 25분).
        </div>
      </div>
    </div>
  </section>

  <!-- ===================== 진행 ===================== -->
  <section id="mx-screen-run" class="mx-screen">
    <div id="mx-timebar"><div id="mx-timebar-fill"></div></div>
    <div id="mx-stage"></div>

    <div id="mx-overlay-pause" class="mx-overlay mx-hidden">
      <div class="mx-box">
        <h2 id="mx-pause-title">휴식</h2>
        <p id="mx-pause-text"></p>
        <p class="mx-count" id="mx-pause-progress"></p>
        <button id="mx-pause-resume" class="mx-primary mx-big">계속하기</button>
      </div>
    </div>

    <div id="mx-overlay-fs" class="mx-overlay mx-hidden">
      <div class="mx-box">
        <h2>전체화면이 해제되었습니다</h2>
        <p>좌표 기준이 달라지므로 진행 중이던 시행 하나는 버리고 다시 제시합니다.</p>
        <button id="mx-fs-reenter" class="mx-primary mx-big">전체화면으로 돌아가기</button>
        <p class="mx-count">여기서 끝내려면 → <button id="mx-fs-abort">중단하고 저장</button></p>
      </div>
    </div>
  </section>

  <!-- ===================== 완료 ===================== -->
  <section id="mx-screen-done" class="mx-screen">
    <div class="mx-panel">
      <h1 id="mx-done-title">완료</h1>
      <div id="mx-done-summary"></div>
      <p id="mx-save-status" class="mx-hint"></p>
      <!-- 서버 저장이 실패해도 25분짜리 세션을 날릴 수 없다 -->
      <button id="mx-download-json">JSON 직접 받기 (예비)</button>
      <button id="mx-back-from-done">처음으로</button>
    </div>
  </section>

</div>
