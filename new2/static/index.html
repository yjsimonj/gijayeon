<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마우스 보정 실험 v3 (로컬)</title>
<link rel="stylesheet" href="experiment.css">
</head>
<body class="mx-standalone">

<!-- =====================================================================
     A안(로컬 실행) 셸 — 계획서 §1의 권장 경로.
       python -m http.server 8000   →   http://localhost:8000/static/

     실험 마크업은 experiment.html 한 곳에만 두고 여기서 읽어 붙인다.
     같은 조각을 app.py 가 Gradio에 붙이므로, 두 경로가 같은 화면을 보장한다.
     file:// 로 직접 열면 fetch가 막힌다 — 반드시 http.server 로 열 것.
===================================================================== -->

<div id="mx-mount">
  <div style="max-width:760px;margin:28px auto;padding:24px 32px;font-family:sans-serif">
    실험 화면을 불러오는 중…
  </div>
</div>

<script src="experiment.js" defer></script>
<script>
fetch('experiment.html', { cache: 'no-store' })
  .then((r) => {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.text();
  })
  .then((html) => {
    document.getElementById('mx-mount').innerHTML = html;
    if (window.mouseExperiment) window.mouseExperiment.mount();
  })
  .catch((e) => {
    document.getElementById('mx-mount').innerHTML =
      '<div style="max-width:760px;margin:28px auto;padding:24px 32px;font-family:sans-serif;color:#b91c1c">' +
      '<b>experiment.html 을 불러올 수 없습니다: ' + e.message + '</b><br><br>' +
      'file:// 로 열지 말고 <code>python -m http.server 8000</code> 후 ' +
      '<code>http://localhost:8000/static/</code> 로 접속하세요.</div>';
  });
</script>

</body>
</html>
