# GitHub → HF Space 자동 동기화 (계획서 §3 B안)
#
# 이 파일은 GitHub 저장소의 루트 .github/workflows/ 에 있어야 동작한다.
# new2/ 안에서는 실행되지 않으므로, 아래 명령으로 복사해서 쓸 것:
#
#   mkdir -p .github/workflows
#   cp new2/tools/github-workflow-sync-space.yml .github/workflows/sync-space.yml
#
# 필요한 설정 (GitHub 저장소 → Settings → Secrets and variables → Actions)
#   Secrets   HF_TOKEN         = HF write 토큰 (Space 시크릿에도 이 값이 등록된다)
#   Variables HF_USER          = yjsimonj
#             HF_SPACE         = 만든 Space 이름
#             HF_DATASET       = mouse-exp-data
#
# 왜 git push 로 Space에 직접 밀지 않는가
#   Space는 루트에 app.py 가 있어야 하는데 이 저장소는 new2/ 아래에 있다.
#   게다가 트리를 통째로 밀면 Space 생성 시 HF가 만들어 준 README.md(sdk_version)가
#   지워져 빌드가 깨진다. 아래 스크립트는 app.py·requirements.txt·static/ 만
#   덮어쓰므로 README가 살아남는다.

name: Sync experiment app to HF Space

on:
  push:
    branches: [main, master]
    paths:
      - 'new2/app.py'
      - 'new2/requirements.txt'
      - 'new2/static/**'
      - '.github/workflows/sync-space.yml'
  workflow_dispatch:        # Actions 탭에서 수동 실행

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install huggingface_hub
        run: pip install "huggingface_hub>=0.25"

      - name: Verify experiment app before deploying
        # 시퀀스·기하·스키마 정합이 깨진 앱을 참가자에게 내보내지 않는다
        run: node new2/tools/selftest.mjs

      - name: Upload to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python new2/tools/deploy_space.py \
            --user "${{ vars.HF_USER }}" \
            --space "${{ vars.HF_SPACE }}" \
            --dataset "${{ vars.HF_DATASET }}" \
            --no-create \
            --deploy
